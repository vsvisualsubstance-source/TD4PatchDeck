<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Machine Scroll Canvas — FG 150% Green</title>
<style>
html, body { margin:0; width:100%; height:100%; overflow:hidden; background:black; }
canvas { display:block; width:100vw; height:100vh; background:black; }
#hint { position:fixed; left:12px; bottom:10px; color:rgba(255,255,255,0.45); font:12px Arial; letter-spacing:.08em; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">F fullscreen</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W=1920,H=1080;
let DPR=Math.min(window.devicePixelRatio||1,2);

function resize(){
  const ww=window.innerWidth, hh=window.innerHeight;
  canvas.width=Math.floor(ww*DPR);
  canvas.height=Math.floor(hh*DPR);
  canvas.style.width=ww+'px';
  canvas.style.height=hh+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  W=ww; H=hh;
}
window.addEventListener('resize',resize); resize();

function rnd(a,b){return a+Math.random()*(b-a);}

// GREEN PRIMARY
const FG='rgba(124,255,91,1)';
const FG_SOFT='rgba(124,255,91,0.6)';
const FG_DIM='rgba(124,255,91,0.25)';

let globalTime=0;
let cols=[];
let numCols=30;

function buildColumns(){
  cols=[];
  const margin=Math.max(60,W*0.05);
  const spacing=(W-margin*2)/(numCols-1);

  for(let i=0;i<numCols;i++){
    const x=margin+i*spacing;
    const speed=rnd(0.9,3.1);
    const phase=rnd(0,Math.PI*2);
    const density=rnd(0.6,1.4);

    let events=[];
    let y=-2600;
    while(y<H+2600){
      y+=rnd(24,84)/density;
      events.push({
        y,
        type:Math.floor(rnd(0,6)),
        size:rnd(26,110) // +50%
      });
    }

    cols.push({x,speed,phase,density,index:i,events});
  }
}
buildColumns();

function drawGuides(){
  ctx.lineWidth=1.2;
  ctx.strokeStyle=FG_DIM;
  for(const c of cols){
    ctx.beginPath();
    ctx.moveTo(c.x,0);
    ctx.lineTo(c.x,H);
    ctx.stroke();
  }
}

function drawField(){
  ctx.lineWidth=1.2;
  for(let i=0;i<28;i++){
    const t=globalTime*0.015+i*0.28;
    const w=180+Math.sin(t*0.8)*150;
    const h=28+Math.cos(t*1.1)*22;
    const y=H*0.5+Math.sin(t+i)*(H*0.28);

    ctx.strokeStyle='rgba(124,255,91,0.08)';
    ctx.beginPath();
    ctx.ellipse(W*0.5,y,Math.abs(w),Math.abs(h),0,0,Math.PI*2);
    ctx.stroke();
  }
}

function drawFrame(){
  ctx.strokeStyle='rgba(124,255,91,0.25)';
  ctx.lineWidth=1.2;
  ctx.strokeRect(20,20,W-40,H-40);
}

function drawConnections(){
  ctx.lineWidth=2.2;
  for(let i=0;i<cols.length-1;i++){
    if(((Math.floor(globalTime/18)+i)%7)===0){
      const a=cols[i], b=cols[i+1];
      const y=(globalTime*(1.5+i*0.03)+i*83)%(H+120)-60;
      const wave=Math.sin(globalTime*0.03+i)*14;

      ctx.strokeStyle='rgba(124,255,91,0.9)';
      ctx.beginPath();
      ctx.moveTo(a.x,y);
      ctx.bezierCurveTo(a.x+18,y+wave,b.x-18,y-wave,b.x,y);
      ctx.stroke();

      ctx.fillStyle=FG;
      ctx.beginPath(); ctx.arc(a.x,y,3,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(b.x,y,3,0,Math.PI*2); ctx.fill();
    }
  }
}

function drawEvent(x,y,ev,phase,index){
  const pulse=0.5+0.5*Math.sin(globalTime*0.05+phase+y*0.03);
  ctx.lineWidth=2.2;

  switch(ev.type){
    case 0:
      ctx.strokeStyle=FG;
      ctx.beginPath();
      ctx.moveTo(x,y-ev.size);
      ctx.lineTo(x,y+ev.size);
      ctx.stroke();
      break;

    case 1:
      ctx.strokeStyle=FG_SOFT;
      ctx.strokeRect(x-16,y-ev.size*0.5,32,ev.size);
      break;

    case 2:
      ctx.fillStyle=FG;
      ctx.beginPath();
      ctx.arc(x,y,5.5,0,Math.PI*2);
      ctx.fill();

      ctx.strokeStyle=`rgba(124,255,91,${0.4+pulse*0.4})`;
      ctx.beginPath();
      ctx.arc(x,y,14+pulse*24,0,Math.PI*2);
      ctx.stroke();
      break;

    case 3:
      ctx.strokeStyle=FG;
      const w=18+pulse*32;
      ctx.beginPath();
      ctx.moveTo(x-w,y);
      ctx.lineTo(x+w,y);
      ctx.moveTo(x,y-7);
      ctx.lineTo(x,y+7);
      ctx.stroke();
      break;

    case 4:
      ctx.strokeStyle=FG_DIM;
      ctx.beginPath();
      for(let i=0;i<5;i++){
        const yy=y+i*8;
        ctx.moveTo(x-20,yy);
        ctx.lineTo(x+20,yy);
      }
      ctx.stroke();
      break;

    case 5:
      ctx.strokeStyle=FG;
      ctx.beginPath();
      ctx.moveTo(x,y-ev.size*0.5);
      ctx.bezierCurveTo(
        x+22*Math.sin(globalTime*0.03+index),
        y,
        x-22*Math.cos(globalTime*0.02+index),
        y,
        x,
        y+ev.size*0.5
      );
      ctx.stroke();
      break;
  }

  if(pulse>0.93){
    ctx.fillStyle=FG;
    ctx.beginPath();
    ctx.arc(x,y,2,0,Math.PI*2);
    ctx.fill();
  }
}

function drawColumns(){
  for(const c of cols){
    const offset=(globalTime*c.speed)%1800;

    for(const ev of c.events){
      let y=ev.y+offset;
      while(y>H+120) y-=3600;
      while(y<-120) y+=3600;
      drawEvent(c.x,y,ev,c.phase,c.index);
    }

    const scannerY=(globalTime*(c.speed*1.85)+c.index*43)%(H+120)-60;
    ctx.strokeStyle=FG;
    ctx.beginPath();
    ctx.moveTo(c.x-22,scannerY);
    ctx.lineTo(c.x+22,scannerY);
    ctx.stroke();
  }
}

function animate(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='black';
  ctx.fillRect(0,0,W,H);

  drawGuides();
  drawField();
  drawColumns();
  drawConnections();
  drawFrame();

  globalTime+=1;
  requestAnimationFrame(animate);
}
animate();

document.addEventListener('keydown',(e)=>{
  if(e.key==='f'||e.key==='F'){
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(()=>{});
    }else{
      document.exitFullscreen().catch(()=>{});
    }
  }
});
</script>
</body>
</html>
